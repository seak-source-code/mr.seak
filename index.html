<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimseak — Mobile Systems Engineer</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  --bg:#070b10;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#58a6ff;
}

body {
  margin:0;
  font-family:-apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* 🌌 Ambient Background */
canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-2;
}

/* ✨ Cursor Glow */
.cursor-glow {
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(88,166,255,0.15), transparent 60%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:-1;
}

/* Header */
.header {
  padding:20px;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

/* Hero */
.hero {
  padding:40px 20px;
}
.hero h1 {
  font-size:34px;
  background:linear-gradient(90deg,#58a6ff,#2ea043,#a371f7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero p {
  color:var(--muted);
  max-width:700px;
}

/* Section */
.section {
  padding:40px 20px;
}
.section h2 {
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:20px;
}

/* Grid */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

/* 💎 Glass Card */
.card {
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  padding:16px;
  border-radius:12px;
  backdrop-filter:blur(14px);
  cursor:pointer;
  transition:0.3s;
}
.card:hover {
  transform:translateY(-6px) scale(1.02);
  border-color:var(--accent);
  box-shadow:0 10px 30px rgba(88,166,255,0.1);
}

/* Glow Edge */
.card::after {
  content:"";
  position:absolute;
  inset:0;
  border-radius:12px;
  padding:1px;
  background:linear-gradient(120deg, transparent, rgba(88,166,255,0.4), transparent);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  opacity:0;
  transition:0.3s;
}
.card:hover::after { opacity:1; }

.card p {
  font-size:13px;
  color:var(--muted);
}

/* 📱 Modal Viewer */
#viewer {
  position:fixed;
  bottom:-100%;
  left:0;
  right:0;
  background:#070b10;
  border-top:1px solid var(--border);
  padding:20px;
  max-height:75%;
  overflow:auto;
  transition:0.35s ease;
  z-index:100;
}
#viewer.active {
  bottom:0;
}

/* Code */
pre {
  background:#020409;
  padding:15px;
  border-radius:10px;
  overflow:auto;
  color:#58a6ff;
}

/* Mobile nav */
.bottom-nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  backdrop-filter:blur(10px);
  background:rgba(7,11,16,0.8);
  border-top:1px solid var(--border);
}
.bottom-nav div {
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
}

/* Desktop */
@media(min-width:900px){
  .bottom-nav { display:none; }
  .hero { padding:80px; }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="cursor-glow" id="glow"></div>

<div class="header">Kimseak — Engineering System</div>

<div class="hero">
  <h1>Seak</h1>
  <p>Mobile Systems Engineer</p>
  <p>I design scalable, reliable mobile systems with offline-first architecture and real-world performance.</p>
</div>

<div class="section">
  <h2>Sharing</h2>
  <div id="sharing" class="grid"></div>
</div>

<div class="section">
  <h2>Code Snippets</h2>
  <div id="codeSnippets" class="grid"></div>
</div>

<div id="viewer"></div>

<div class="bottom-nav">
  <div onclick="go('sharing')">Sharing</div>
  <div onclick="go('codeSnippets')">Code</div>
</div>

<script>

/* DATA */
const sharing = [
{title:"Offline-first",desc:"Design without network",content:"# Offline\nLocal → Sync → Resolve"},
{title:"Failure Default",desc:"Expect failure",content:"# Failure\nAlways fallback"},
{title:"Architecture",desc:"Structure matters",content:"# Architecture\nLong-term thinking"},
{title:"Performance",desc:"Design matters",content:"# Performance\nReduce work"},
{title:"State",desc:"Control flow",content:"# State\nSingle truth"},
{title:"Security",desc:"Protect system",content:"# Security\nNever trust client"}
];

const codeSnippets = [
{title:"iOS Async",desc:"Swift async",code:`let (data, _) = try await URLSession.shared.data(from:url)`},
{title:"Android Retry",desc:"Kotlin retry",code:`repeat(3){ try{ call() } catch(e:Exception){} }`},
{title:"Cache Fallback",desc:"Offline support",code:`if(apiFail) return cache`}
];

/* RENDER */
function render(){
  sharing.forEach(i=>add("sharing",i,"post"));
  codeSnippets.forEach(i=>add("codeSnippets",i,"code"));
}

function add(id,item,type){
  document.getElementById(id).innerHTML += `
  <div class="card" onclick='openItem(${JSON.stringify(item)},"${type}")'>
    <h3>${item.title}</h3>
    <p>${item.desc}</p>
  </div>`;
}

/* VIEWER */
function openItem(item,type){
  viewer.classList.add("active");
  viewer.innerHTML = type==="code"
    ? `<h2>${item.title}</h2><pre>${item.code}</pre>`
    : marked.parse(item.content);
}
viewer.onclick=()=>viewer.classList.remove("active");

/* NAV */
function go(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

/* 🎇 Background animation */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<60;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    dx:(Math.random()-0.5)*0.3,
    dy:(Math.random()-0.5)*0.3
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
    ctx.fillStyle="rgba(88,166,255,0.3)";
    ctx.fillRect(p.x,p.y,2,2);
  });
  requestAnimationFrame(animate);
}
animate();

/* ✨ Cursor glow (disable on mobile) */
if(window.innerWidth > 768){
  const glow=document.getElementById("glow");
  window.addEventListener("mousemove",(e)=>{
    glow.style.left=e.clientX+"px";
    glow.style.top=e.clientY+"px";
  });
}else{
  document.getElementById("glow").style.display="none";
}

render();

</script>

</body>
</html>
