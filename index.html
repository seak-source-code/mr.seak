<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimseak — AI Engineering System</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  --bg:#04070c;
  --text:#e6edf3;
  --muted:#8b949e;
}

/* 🌌 BASE */
body {
  margin:0;
  font-family:"Space Grotesk", sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* 🌈 RAINBOW AI BACKGROUND */
body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,255,0.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,0,255,0.15), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(0,255,128,0.1), transparent 50%);
  z-index:-3;
}

/* ✨ STAR */
canvas {
  position:fixed;
  inset:0;
  z-index:-2;
}

/* GRID */
body::after {
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:70px 70px;
  z-index:-1;
}

/* HEADER */
.header {
  padding:20px 30px;
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.1);
}

/* HERO */
.hero {
  padding:80px 8vw;
}
.hero h1 {
  font-size:48px;
  background:linear-gradient(90deg,#00f0ff,#ff00ff,#00ff88);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero p {
  max-width:700px;
  color:var(--muted);
}

/* SECTION */
.section {
  padding:60px 8vw;
}
.section h2 {
  font-size:12px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:20px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* 🌈 AI CARD */
.card {
  position:relative;
  padding:20px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
  transition:0.3s;
}

.card:hover {
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 20px 60px rgba(0,255,255,0.1);
}

/* rainbow edge */
.card::after {
  content:"";
  position:absolute;
  inset:0;
  border-radius:16px;
  padding:1px;
  background:linear-gradient(120deg,#00f0ff,#ff00ff,#00ff88);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  opacity:0;
  transition:0.3s;
}
.card:hover::after { opacity:1; }

/* VIEWER */
#viewer {
  position:fixed;
  bottom:-100%;
  left:0;
  right:0;
  background:#04070c;
  padding:30px;
  max-height:75%;
  overflow:auto;
  transition:0.4s;
}
#viewer.active { bottom:0; }

/* CODE */
pre {
  background:#020409;
  padding:20px;
  border-radius:12px;
  color:#00f0ff;
  overflow:auto;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="header">Kimseak — AI System</div>

<div class="hero">
  <h1>Kimseak Phorn</h1>
  <p>Mobile Systems Engineer • AI Thinking • Production Architecture</p>
</div>

<!-- SHARING -->
<div class="section">
  <h2>Engineering Insights</h2>
  <div id="sharing" class="grid"></div>
</div>

<!-- CODE -->
<div class="section">
  <h2>Code Patterns</h2>
  <div id="codeSnippets" class="grid"></div>
</div>

<div id="viewer"></div>

<script>

/* 🧠 12+ ELITE INSIGHTS */
const sharing = [
{title:"Offline-first Systems",desc:"Design beyond network",content:"# Offline-first\nAlways assume no internet."},
{title:"Failure is Default",desc:"Resilience thinking",content:"# Failure\nFallback > Crash"},
{title:"Architecture > Code",desc:"Longevity",content:"# Architecture\nStructure defines life"},
{title:"API Reality",desc:"Mobile constraints",content:"# API\nRetry + idempotent"},
{title:"Performance Design",desc:"Not optimization",content:"# Performance\nReduce work"},
{title:"State Control",desc:"Predictability",content:"# State\nSingle source"},
{title:"Flow Thinking",desc:"UX system",content:"# Flow\nUser journey"},
{title:"Cache Layer",desc:"Speed",content:"# Cache\nAlways fallback"},
{title:"Sync Engine",desc:"Offline complexity",content:"# Sync\nConflict resolve"},
{title:"Security Model",desc:"Trust nothing",content:"# Security\nValidate all"},
{title:"Scalability",desc:"Future ready",content:"# Scale\nDesign early"},
{title:"Engineering Judgment",desc:"Decision making",content:"# Judgment\nTrade-offs"},
{title:"System Behavior",desc:"Real-world",content:"# Behavior\nHandle edge cases"}
];

/* 💻 CODE SNIPPETS */
const codeSnippets = [

{title:"iOS Async Await",desc:"Swift networking",
code:`let (data, _) = try await URLSession.shared.data(from: url)`},

{title:"iOS Retry",desc:"Swift retry",
code:`func retry(times:Int){ if times>0 { retry(times:times-1) } }`},

{title:"Android Retry",desc:"Kotlin",
code:`repeat(3){ try{ call() } catch(e:Exception){} }`},

{title:"Android Flow",desc:"StateFlow",
code:`val state = MutableStateFlow<Data?>(null)`},

{title:"API Fallback",desc:"Cache pattern",
code:`if(apiFails){ return cache }`},

{title:"Queue System",desc:"Offline queue",
code:`let queue = []`},

{title:"Exponential Backoff",desc:"Retry logic",
code:`delay = base * 2^attempt`}

];

/* RENDER */
function render(){
  sharing.forEach(i=>{
    document.getElementById("sharing").innerHTML += card(i,"post");
  });

  codeSnippets.forEach(i=>{
    document.getElementById("codeSnippets").innerHTML += card(i,"code");
  });
}

function card(item,type){
  return `<div class="card" onclick='openItem(${JSON.stringify(item)},"${type}")'>
    <h3>${item.title}</h3>
    <p>${item.desc}</p>
  </div>`;
}

/* VIEWER */
function openItem(item,type){
  viewer.classList.add("active");
  viewer.innerHTML = type==="code"
    ? `<h2>${item.title}</h2><pre>${item.code}</pre>`
    : marked.parse(item.content);
}
viewer.onclick=()=>viewer.classList.remove("active");

/* 🌌 STAR FIELD */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let stars=[];
for(let i=0;i<150;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height});
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    ctx.fillStyle="white";
    ctx.fillRect(s.x,s.y,1.2,1.2);
  });
  requestAnimationFrame(animate);
}
animate();

render();

</script>

</body>
</html>
