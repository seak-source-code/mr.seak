<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimseak — Mobile Systems Engineer</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  --bg:#04070c;
  --text:#e6edf3;
  --muted:#8b949e;
}

body {
  margin:0;
  font-family:"Space Grotesk", sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

canvas { position:fixed; inset:0; z-index:-2; }

body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,255,0.12), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,0,255,0.12), transparent 40%);
  z-index:-3;
  animation: glowMove 20s infinite linear;
}

@keyframes glowMove {
  0% { transform: translate(0,0); }
  50% { transform: translate(-40px,-20px); }
  100% { transform: translate(0,0); }
}

.hero {
  padding:80px 8vw;
  text-align:center;
}

.profile-img {
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 20px cyan, 0 0 40px magenta;
}

.hero h1 {
  font-size:48px;
  background:linear-gradient(90deg,#00f0ff,#ff00ff,#00ff88);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.section { padding:60px 8vw; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card {
  padding:20px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
  transition:0.3s;
}
.card:hover { transform:translateY(-6px); }

#viewer {
  position:fixed;
  bottom:-100%;
  left:0;
  right:0;
  background:#04070c;
  padding:30px;
  max-height:75%;
  overflow:auto;
  transition:0.4s;
}
#viewer.active { bottom:0; }

pre {
  background:#020409;
  padding:20px;
  border-radius:12px;
  color:#00f0ff;
  overflow:auto;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">
  <img src="https://raw.githubusercontent.com/seak-source-code/kimseak-portfolio/refs/heads/main/kimseak.jpg" class="profile-img">
  <h1>Kimseak Phorn</h1>
  <p>Mobile Systems Engineer</p>
</div>

<div class="section">
  <h2>Engineering Notes</h2>
  <div id="sharing" class="grid"></div>
</div>

<div class="section">
  <h2>Code Patterns</h2>
  <div id="codeSnippets" class="grid"></div>
</div>

<div id="viewer"></div>

<script>

/* 🧠 15 ENGINEERING NOTES */
const sharing = [
{title:"Offline-first",desc:"Local-first data flow",content:"# Offline-first\nPersist locally → queue actions → sync in background → resolve conflicts."},
{title:"Failure Handling",desc:"Plan for failure",content:"# Failure\nRetry with backoff, fallback to cache, keep state consistent."},
{title:"Architecture > Code",desc:"Longevity",content:"# Architecture\nStructure survives refactors; code does not."},
{title:"API Design",desc:"Mobile reality",content:"# API\nIdempotent endpoints, pagination, partial responses."},
{title:"Performance",desc:"System-level",content:"# Performance\nMinimize network, avoid blocking main thread, cache aggressively."},
{title:"State Management",desc:"Predictable UI",content:"# State\nSingle source of truth, avoid duplicated state."},
{title:"User Flow",desc:"Experience first",content:"# Flow\nDesign end-to-end journeys, not isolated screens."},
{title:"Caching Strategy",desc:"Speed + resilience",content:"# Cache\nMemory + disk layers; invalidate carefully."},
{title:"Sync Engine",desc:"Hard problem",content:"# Sync\nQueue → retry → conflict resolution."},
{title:"Security",desc:"Defense in depth",content:"# Security\nValidate server-side, secure storage, token rotation."},
{title:"Scalability",desc:"Future-ready",content:"# Scale\nDesign APIs and data models for growth."},
{title:"Observability",desc:"Debug production",content:"# Logs\nStructured logs, metrics, error tracking."},
{title:"Battery Awareness",desc:"Mobile constraint",content:"# Battery\nBatch work, reduce wakeups, use background APIs."},
{title:"Network Strategy",desc:"Unstable by default",content:"# Network\nTimeouts, retries, exponential backoff."},
{title:"Release Discipline",desc:"Stability",content:"# Release\nFeature flags, staged rollout, crash monitoring."}
];

/* 💻 12 CODE SNIPPETS */
const codeSnippets = [

{title:"Swift Async/Await",desc:"Networking",
code:`let (data, _) = try await URLSession.shared.data(from: url)`},

{title:"Swift Retry",desc:"Basic retry",
code:`func retry(times:Int, task:()->Void){
  guard times > 0 else { return }
  task()
  retry(times: times-1, task: task)
}`},

{title:"Swift Keychain Save",desc:"Secure storage",
code:`Keychain.save("token", value: token)`},

{title:"Kotlin Coroutine Call",desc:"Async API",
code:`val data = withContext(Dispatchers.IO){ api.get() }`},

{title:"Kotlin Retry",desc:"Retry block",
code:`repeat(3){
  try { call(); return }
  catch(e:Exception){}
}`},

{title:"Kotlin Flow State",desc:"Reactive",
code:`val state = MutableStateFlow<Data?>(null)`},

{title:"Cache Fallback",desc:"Resilience",
code:`return apiData ?: cacheData`},

{title:"Queue System",desc:"Offline",
code:`queue.push(request)`},

{title:"Exponential Backoff",desc:"Retry timing",
code:`delay = base * Math.pow(2, attempt)`},

{title:"Debounce Input",desc:"Search",
code:`setTimeout(fn, 300)`},

{title:"Pagination",desc:"Load more",
code:`page += 1; fetch(page)`},

{title:"Error Wrapper",desc:"Safe call",
code:`try { call() } catch(e){ log(e) }`}
];

/* RENDER */
function render(){
  sharing.forEach(i=>{
    sharingEl.innerHTML += card(i,"post");
  });
  codeSnippets.forEach(i=>{
    codeSnippetsEl.innerHTML += card(i,"code");
  });
}

function card(item,type){
  return `<div class="card" onclick='openItem(${JSON.stringify(item)},"${type}")'>
    <h3>${item.title}</h3>
    <p>${item.desc}</p>
  </div>`;
}

const sharingEl=document.getElementById("sharing");
const codeSnippetsEl=document.getElementById("codeSnippets");

function openItem(item,type){
  viewer.classList.add("active");
  viewer.innerHTML = type==="code"
    ? `<h2>${item.title}</h2><pre>${item.code}</pre>`
    : marked.parse(item.content);
}

viewer.onclick=()=>viewer.classList.remove("active");

/* 🌌 BACKGROUND */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let stars=[];
for(let i=0;i<120;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height});
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    ctx.fillStyle="white";
    ctx.fillRect(s.x,s.y,1.2,1.2);
  });
  requestAnimationFrame(animate);
}
animate();

render();

</script>

</body>
</html>
